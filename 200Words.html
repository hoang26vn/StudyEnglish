<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text-main: #1F2937;
      --text-sub: #6B7280;
      --highlight: #EEF2FF;
      --active-border: #6366F1;
      --danger: #EF4444;
      --success: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 40px; }

    /* Control Panel */
    .sticky-control-panel {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid #E5E7EB; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 12px 16px;
    }
    .panel-container { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .control-group { display: flex; align-items: center; gap: 8px; }

    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #E5E7EB; color: var(--text-main); }
    .btn-secondary:hover { background: #D1D5DB; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #DC2626; }

    select { padding: 8px 12px; border-radius: 6px; border: 1px solid #D1D5DB; background: white; font-size: 14px; color: var(--text-main); outline: none; cursor: pointer; }

    /* Layout */
    .container { max-width: 1000px; margin: 20px auto 0; padding: 0 16px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 26px; color: var(--primary); }
    .header p { font-size: 15px; color: var(--text-sub); }

    .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px 12px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative; }
    .card.active { border-color: var(--active-border); background-color: var(--highlight); transform: scale(1.02); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }

    .word { font-size: 20px; font-weight: 700; color: var(--text-main); text-transform: capitalize; }
    .ipa { font-size: 13px; color: #059669; font-weight: 500; margin: 2px 0 4px; }
    .meaning { font-size: 14px; color: var(--text-sub); font-weight: 500; margin-bottom: 12px; }

    .action-group { display: flex; gap: 8px; margin-bottom: 8px; }
    
    .icon-btn { border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .icon-btn:active { transform: scale(0.92); }
    .audio-btn { background: #EEF2FF; color: var(--primary); }
    .audio-btn:hover { background: #E0E7FF; }
    
    .mic-btn { background: #FEE2E2; color: var(--danger); }
    .mic-btn:hover { background: #FCA5A5; }
    .mic-btn.listening { background: var(--danger); color: white; animation: pulse 1.2s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Feedback message */
    .feedback { font-size: 13px; font-weight: 700; min-height: 20px; text-align: center; }
    .feedback.correct { color: var(--success); }
    .feedback.incorrect { color: var(--danger); }
    .feedback.listening { color: var(--primary); font-style: italic; font-weight: 500; }
  </style>
</head>

          { word: "flower", ipa: "/'flaʊər/", meaning: "bông hoa" }, { word: "grass", ipa: "/ɡræs/", meaning: "cỏ" },
          { word: "river", ipa: "/'rɪvər/", meaning: "sông" }, { word: "mountain", ipa: "/'maʊntn/", meaning: "núi" },
          { word: "morning", ipa: "/'mɔ:rnɪŋ/", meaning: "buổi sáng" }, { word: "afternoon", ipa: "/ˌæftər'nu:n/", meaning: "buổi chiều" },
          { word: "night", ipa: "/naɪt/", meaning: "buổi đêm" }, { word: "happy", ipa: "/'hæpi/", meaning: "vui vẻ" },
          { word: "sad", ipa: "/sæd/", meaning: "buồn bã" }, { word: "angry", ipa: "/'æŋɡri/", meaning: "tức giận" },
          { word: "scared", ipa: "/skerd/", meaning: "sợ hãi" }, { word: "excited", ipa: "/ɪk'saɪtɪd/", meaning: "hào hứng" }
        ]
      }
    ];

    let currentCardIndex = -1;
    let isPlayingAll = false;
    let isPaused = false;
    let availableVoices = [];
    let activeRecognition = null;

    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function initDropdown() {
      const select = document.getElementById("topicSelect");
      topicsData.forEach((topic, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${topic.title} (${topic.titleVi})`;
        select.appendChild(option);
      });
    }

    function renderVocabulary() {
      stopSpeech();
      const topicIndex = document.getElementById("topicSelect").value || 0;
      const currentTopic = topicsData[topicIndex];

      document.getElementById("topicTitle").textContent = currentTopic.title;
      document.getElementById("topicTitleVi").textContent = currentTopic.titleVi;

      const vocabGrid = document.getElementById("vocabGrid");
      vocabGrid.innerHTML = "";

      currentTopic.words.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${index}`;
        card.innerHTML = `
          <div class="word">${item.word}</div>
          <div class="ipa">${item.ipa}</div>
          <div class="meaning">${item.meaning}</div>
          <div class="action-group">
            <button class="icon-btn audio-btn" onclick="speakSingle(${index})" title="Nghe đọc">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <button id="mic-btn-${index}" class="icon-btn mic-btn" onclick="startRecognition(${index}, '${item.word}')" title="Thu âm & kiểm tra phát âm">
              <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
          </div>
          <div class="feedback" id="feedback-${index}"></div>
        `;
        vocabGrid.appendChild(card);
      });
    }

    function changeTopic() { renderVocabulary(); }

    function speakSingle(index) {
      if (isPlayingAll) stopSpeech();
      highlightCard(index);
      const topicIndex = document.getElementById("topicSelect").value || 0;
      const word = topicsData[topicIndex].words[index].word;
      speakWord(word, () => unhighlightCard(index));
    }

    function speakWord(text, onEndCallback) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const lang = document.getElementById("accentSelect").value;
      const rate = parseFloat(document.getElementById("rateSelect").value);

      utterance.lang = lang;
      utterance.rate = rate;

      if (availableVoices.length === 0) loadVoices();
      const targetVoice = availableVoices.find(v => v.lang === lang || v.lang.replace('_', '-') === lang);
      if (targetVoice) utterance.voice = targetVoice;

      utterance.onend = () => { if (onEndCallback) onEndCallback(); };
      utterance.onerror = () => { if (onEndCallback) onEndCallback(); };

      window.speechSynthesis.speak(utterance);
    }

    /* Speech Recognition Functions */
    function startRecognition(index, targetWord) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Trình duyệt của bạn chưa hỗ trợ nhận diện giọng nói. Vui lòng sử dụng Google Chrome hoặc Edge.");
        return;
      }

      if (isPlayingAll) stopSpeech();
      if (activeRecognition) activeRecognition.abort();

      const micBtn = document.getElementById(`mic-btn-${index}`);
      const feedbackEl = document.getElementById(`feedback-${index}`);

      micBtn.classList.add("listening");
      feedbackEl.className = "feedback listening";
      feedbackEl.textContent = "Đang nghe...";

      const recognition = new SpeechRecognition();
      activeRecognition = recognition;

      const selectedLang = document.getElementById("accentSelect").value;
      recognition.lang = selectedLang;
      recognition.interimResults = false;
      recognition.maxAlternatives = 3;

      recognition.onresult = (event) => {
        micBtn.classList.remove("listening");
        const results = Array.from(event.results[0]).map(r => r.transcript.toLowerCase().trim());
        const cleanTarget = targetWord.toLowerCase().trim();

        const isCorrect = results.some(transcript => transcript === cleanTarget || transcript.includes(cleanTarget));

        if (isCorrect) {
          feedbackEl.className = "feedback correct";
          feedbackEl.textContent = "✓ Chính xác!";
        } else {
          feedbackEl.className = "feedback incorrect";
          feedbackEl.textContent = `✕ Chưa đúng! (${results[0]})`;
        }
      };

      recognition.onerror = (event) => {
        micBtn.classList.remove("listening");
        feedbackEl.className = "feedback incorrect";
        if (event.error === 'not-allowed') {
          feedbackEl.textContent = "Chưa cấp quyền mic";
        } else {
          feedbackEl.textContent = "Thử lại...";
        }
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        activeRecognition = null;
      };

      recognition.start();
    }

    function togglePlayAll() {
      const playBtn = document.getElementById("playBtn");

      if (!isPlayingAll) {
        isPlayingAll = true;
        isPaused = false;
        playBtn.textContent = "⏸ Pause";
        playBtn.className = "btn btn-secondary";
        if (currentCardIndex === -1) currentCardIndex = 0;
        playNextWord();
      } else if (isPaused) {
        isPaused = false;
        playBtn.textContent = "⏸ Pause";
        playBtn.className = "btn btn-secondary";
        playNextWord();
      } else {
        isPaused = true;
        playBtn.textContent = "▶ Resume";
        playBtn.className = "btn btn-primary";
        window.speechSynthesis.cancel();
      }
    }

    function playNextWord() {
      if (!isPlayingAll || isPaused) return;

      const topicIndex = document.getElementById("topicSelect").value || 0;
      const words = topicsData[topicIndex].words;

      if (currentCardIndex >= words.length) {
        stopSpeech();
        return;
      }

      highlightCard(currentCardIndex);
      const word = words[currentCardIndex].word;

      speakWord(word, () => {
        unhighlightCard(currentCardIndex);
        currentCardIndex++;
        if (isPlayingAll && !isPaused) {
          setTimeout(playNextWord, 400);
        }
      });
    }

    function stopSpeech() {
      window.speechSynthesis.cancel();
      if (activeRecognition) activeRecognition.abort();
      if (currentCardIndex !== -1) unhighlightCard(currentCardIndex);
      isPlayingAll = false;
      isPaused = false;
      currentCardIndex = -1;

      const playBtn = document.getElementById("playBtn");
      playBtn.textContent = "▶ Play All";
      playBtn.className = "btn btn-primary";
    }

    function updateVoiceSettings() {
      if (isPlayingAll && !isPaused) {
        window.speechSynthesis.cancel();
        playNextWord();
      }
    }

    function highlightCard(index) {
      const activeCard = document.querySelector('.card.active');
      if (activeCard) activeCard.classList.remove('active');

      const card = document.getElementById(`card-${index}`);
      if (card) {
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function unhighlightCard(index) {
      const card = document.getElementById(`card-${index}`);
      if (card) card.classList.remove('active');
    }

    loadVoices();
    initDropdown();
    renderVocabulary();
  </script>
</body>
</html>
